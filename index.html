<!-- #region head -->
<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Landing Page</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <!-- #endregion -->
  <body class="page__body">
    <header class="header">
      <div class="top-bar">
        <a href="#">
          <img
            class="top-bar__logo"
            src="src/images/whitelogo.svg"
            alt="MyBike logo"
          />
        </a>
        <div class="top-bar__icons">
          <a
            href="#"
            class="icon icon--phone"
          ></a>
          <a
            href="#menu"
            class="icon icon--menu"
          ></a>
        </div>
      </div>
      <div class="header__bottom">
        <h1 class="header__bottom-title">Take the Streets</h1>
      </div>
    </header>

    <aside
      class="menu page__menu"
      id="menu"
    >
      <div class="top-bar">
        <a href="#">
          <img
            class="top-bar__logo"
            src="src/images/blacklogo.svg"
            alt="MyBike blackLogo"
          />
        </a>
        <div class="top-bar__icons">
          <a
            href="#"
            class="icon icon--close"
          ></a>
        </div>
      </div>

      <div class="menu__bottom">
        <nav class="nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a
                class="nav__link"
                href="#"
              >
                home
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#about-us"
              >
                about us
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#compare-bikes"
              >
                compare bikes
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#details"
              >
                details
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#contacts"
              >
                contacts
              </a>
            </li>
          </ul>
        </nav>

        <a
          class="menu__phone-number"
          href="tel:+1 234 5555-55-55"
        >
          +1 234 5555-55-55
        </a>
        <a
          class="menu__book-a-ride"
          href="tel:+1 234 5555-55-55"
        >
          book a test ride
        </a>
      </div>
    </aside>

    <main>
      <section
        class="about-us"
        id="about-us"
      >
        <h2></h2>
        <h4></h4>
      </section>

      <section
        class="compare-bikes"
        id="compare-bikes"
      >
        <h2>Compare Bikes</h2>
      </section>

      <section
        class="details"
        id="details"
      ></section>

      <section
        class="contacts"
        id="contacts"
      ></section>
    </main>

    <footer></footer>
  </body>
</html>
